<!-- viewBox is cropped to the artwork rather than left at the 0 0 300 300 the
     coordinates are authored in. The border rect used to reach the edges of
     that box, so `object-fit: contain` scaled the badge to fill its tile; with
     the rect gone the drawing measures 218x216 (getBBox) and would have been
     scaled to 73% of the tile — visibly lighter than the twelve badges around
     it, which fill about 85%. The window below is that 85%: square, centred on
     the drawing's real centre of (150, 152), leaving an even ~19 units of air.
     Nothing inside is moved; only what is framed changes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 24 256 256" width="256" height="256">
  <!-- No border box. The supplied badge carried a white plate with a #D4A843
       rounded border, which made sense as a standalone asset but not in the
       awards wall: every other tile there is bare artwork sitting on the grid's
       own #f4f6fb plate, so this one read as a framed card inside a card. The
       plate is also what .award-card already exists to provide — see the note
       beside it about mostly-white badges dissolving into the section ground.
       Dropping the rect takes the white fill with it, so the artwork sits
       straight on that plate like its twelve neighbours. -->

  <!-- Wreath and trophy, stacked above the wordmark rather than beside it.
       The cluster is drawn in its original coordinates and placed as a whole:
       it spans x 12..138 and y 29..95 there, so its centre is (75, 62), and the
       transform below reads outwards — move that centre to (150, 100), scaled
       1.55 to fill the wider box. Keeping the artwork untouched inside the
       group is what makes the trophy, the star and the ten leaves keep their
       proportions to each other. -->
  <g transform="translate(150, 97) scale(1.55) translate(-75, -62)">
    <!-- Left laurel wreath leaves -->
    <g transform="translate(38, 60)" fill="#D4A843">
      <ellipse cx="-8" cy="-22" rx="5" ry="9" transform="rotate(-30 -8 -22)"/>
      <ellipse cx="-12" cy="-10" rx="5" ry="9" transform="rotate(-50 -12 -10)"/>
      <ellipse cx="-12" cy="4" rx="5" ry="9" transform="rotate(-70 -12 4)"/>
      <ellipse cx="-8" cy="18" rx="5" ry="9" transform="rotate(-100 -8 18)"/>
      <ellipse cx="0" cy="28" rx="4" ry="7" transform="rotate(-120 0 28)"/>
    </g>

    <!-- Right laurel wreath leaves -->
    <g transform="translate(112, 60)" fill="#D4A843">
      <ellipse cx="8" cy="-22" rx="5" ry="9" transform="rotate(30 8 -22)"/>
      <ellipse cx="12" cy="-10" rx="5" ry="9" transform="rotate(50 12 -10)"/>
      <ellipse cx="12" cy="4" rx="5" ry="9" transform="rotate(70 12 4)"/>
      <ellipse cx="8" cy="18" rx="5" ry="9" transform="rotate(100 8 18)"/>
      <ellipse cx="0" cy="28" rx="4" ry="7" transform="rotate(120 0 28)"/>
    </g>

    <!-- Trophy cup -->
    <g transform="translate(75, 60)">
      <!-- Cup body -->
      <path d="M-16,-18 Q-16,-26 0,-26 Q16,-26 16,-18 L14,2 Q12,10 0,10 Q-12,10 -14,2 Z" fill="#D4A843" stroke="#D4A843" stroke-width="1"/>
      <!-- Cup rim -->
      <ellipse cx="0" cy="-26" rx="16" ry="3" fill="none" stroke="#D4A843" stroke-width="2"/>
      <!-- Star inside cup -->
      <polygon points="0,-20 3.5,-12 12,-12 5.5,-6 8,2 0,-3 -8,2 -5.5,-6 -12,-12 -3.5,-12" fill="white" stroke="white" stroke-width="0.5" stroke-linejoin="round"/>
      <!-- Left handle -->
      <path d="M-16,-20 Q-26,-20 -26,-10 Q-26,0 -16,0" fill="none" stroke="#D4A843" stroke-width="3" stroke-linecap="round"/>
      <!-- Right handle -->
      <path d="M16,-20 Q26,-20 26,-10 Q26,0 16,0" fill="none" stroke="#D4A843" stroke-width="3" stroke-linecap="round"/>
      <!-- Stem -->
      <rect x="-3" y="10" width="6" height="12" fill="#D4A843" rx="1"/>
      <!-- Base -->
      <rect x="-10" y="22" width="20" height="4" rx="2" fill="#D4A843"/>
    </g>
  </g>

  <!-- The divider, same #D4A843 at 2px with round caps as the landscape badge
       drew it. It separated a left half from a right half there, so stacking
       the badge turns it on its side: it now sits between the trophy and the
       wordmark and keeps the same share of the box it had before — 64 of 120
       across, 110 of 300 here. -->
  <line x1="95" y1="173" x2="205" y2="173" stroke="#D4A843" stroke-width="2" stroke-linecap="round"/>

  <!-- Wordmark, centred under the divider. -->
  <text x="150" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#6B7280" font-weight="400" letter-spacing="0.5">Recognized on</text>
  <text x="150" y="251" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" fill="#1E293B" font-weight="700" letter-spacing="-0.5">Goodfirms</text>
</svg>
