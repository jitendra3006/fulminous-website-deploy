<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- Continuous rounded border -->
  <rect x="1" y="1" width="398" height="118" rx="14" ry="14" fill="white" stroke="#D4A843" stroke-width="2"/>
  
  <!-- Left laurel wreath leaves -->
  <g transform="translate(38, 60)" fill="#D4A843">
    <ellipse cx="-8" cy="-22" rx="5" ry="9" transform="rotate(-30 -8 -22)"/>
    <ellipse cx="-12" cy="-10" rx="5" ry="9" transform="rotate(-50 -12 -10)"/>
    <ellipse cx="-12" cy="4" rx="5" ry="9" transform="rotate(-70 -12 4)"/>
    <ellipse cx="-8" cy="18" rx="5" ry="9" transform="rotate(-100 -8 18)"/>
    <ellipse cx="0" cy="28" rx="4" ry="7" transform="rotate(-120 0 28)"/>
  </g>
  
  <!-- Right laurel wreath leaves -->
  <g transform="translate(112, 60)" fill="#D4A843">
    <ellipse cx="8" cy="-22" rx="5" ry="9" transform="rotate(30 8 -22)"/>
    <ellipse cx="12" cy="-10" rx="5" ry="9" transform="rotate(50 12 -10)"/>
    <ellipse cx="12" cy="4" rx="5" ry="9" transform="rotate(70 12 4)"/>
    <ellipse cx="8" cy="18" rx="5" ry="9" transform="rotate(100 8 18)"/>
    <ellipse cx="0" cy="28" rx="4" ry="7" transform="rotate(120 0 28)"/>
  </g>
  
  <!-- Trophy cup -->
  <g transform="translate(75, 60)">
    <!-- Cup body -->
    <path d="M-16,-18 Q-16,-26 0,-26 Q16,-26 16,-18 L14,2 Q12,10 0,10 Q-12,10 -14,2 Z" fill="#D4A843" stroke="#D4A843" stroke-width="1"/>
    <!-- Cup rim -->
    <ellipse cx="0" cy="-26" rx="16" ry="3" fill="none" stroke="#D4A843" stroke-width="2"/>
    <!-- Star inside cup -->
    <polygon points="0,-20 3.5,-12 12,-12 5.5,-6 8,2 0,-3 -8,2 -5.5,-6 -12,-12 -3.5,-12" fill="white" stroke="white" stroke-width="0.5" stroke-linejoin="round"/>
    <!-- Left handle -->
    <path d="M-16,-20 Q-26,-20 -26,-10 Q-26,0 -16,0" fill="none" stroke="#D4A843" stroke-width="3" stroke-linecap="round"/>
    <!-- Right handle -->
    <path d="M16,-20 Q26,-20 26,-10 Q26,0 16,0" fill="none" stroke="#D4A843" stroke-width="3" stroke-linecap="round"/>
    <!-- Stem -->
    <rect x="-3" y="10" width="6" height="12" fill="#D4A843" rx="1"/>
    <!-- Base -->
    <rect x="-10" y="22" width="20" height="4" rx="2" fill="#D4A843"/>
  </g>
  
  <!-- Vertical divider -->
  <line x1="140" y1="28" x2="140" y2="92" stroke="#D4A843" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Recognized on text -->
  <text x="160" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280" font-weight="400" letter-spacing="0.5">Recognized on</text>
  
  <!-- Goodfirms text -->
  <text x="160" y="82" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#1E293B" font-weight="700" letter-spacing="-0.5">Goodfirms</text>
</svg>
